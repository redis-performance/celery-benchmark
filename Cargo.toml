[package]
name = "celery-bench"
version = "0.1.3"
edition = "2021"

[lib]
name = "celery_bench"
path = "src/lib.rs"

[[bin]]
name = "celery-bench"
path = "src/main.rs"

[dependencies]
# No official Rust client exists for Celery/kombu (the closest, `rusty-celery`, is an
# unofficial, largely dormant community crate) — we implement kombu's Redis transport
# wire protocol directly against the `redis` crate for fidelity. See README "Protocol
# compatibility" for exact kombu/celery source citations.
#
# tls-rustls-webpki-roots bundles Mozilla root CAs so TLS works without OS ca-certificates
# tokio-rustls-comp: async TLS integration
# tls-rustls-insecure: makes the documented rediss://host:port/#insecure URL fragment (and our
# --insecure flag, which sets that same fragment) actually skip certificate verification.
# DO NOT REMOVE: without this feature, redis-rs still parses the #insecure fragment (that
# parsing is gated on tls-rustls/tls-native-tls, not this feature — see
# redis-1.5.0/src/connection.rs:548-563, the version pinned in this crate's Cargo.lock) but
# then HARD-FAILS every rediss://...#insecure connection attempt at connect time with
# "Cannot create insecure client without tls-rustls-insecure feature"
# (redis-1.5.0/src/connection.rs:1274-1279) — i.e. --insecure
# would go from "skips verification" to "cannot connect at all", not to a silent no-op.
# CI's "Guard against tls-rustls-insecure feature regression" step (.github/workflows/ci.yml)
# fails the build if this is ever dropped from the resolved dependency graph.
redis = { version = "1", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure"] }

# redis-rs's rustls integration deliberately does NOT pick a crypto backend for you
# (its own `rustls` dependency is default-features = false — only `rustls/std` is enabled,
# see redis-1.5.0/Cargo.toml:493-496, the version pinned in this crate's Cargo.lock) so it
# never enables rustls's "ring" or "aws-lc-rs" feature anywhere in the dependency graph.
# rustls 0.23 requires the *application* to install a process-wide CryptoProvider once
# (rustls::crypto::CryptoProvider::install_default) before any TLS connection is attempted,
# or every TLS connection panics ("Could not automatically determine the process-level
# CryptoProvider..."). This crate IS used directly in our code — src/tls.rs's
# install_crypto_provider() calls rustls::crypto::ring::default_provider() itself — so this
# dependency both enables rustls's "ring" feature for the single resolved rustls package AND
# is the crate that install_crypto_provider() calls into. main() calls
# celery_bench::tls::install_crypto_provider() at startup (not install_default() inline).
# Matches redis-rs's own dev-dependencies, which use the same "ring" feature for their tests
# (redis-1.5.0/Cargo.toml:604-606).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Latency histogram
hdrhistogram = "7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization — Celery/kombu message envelopes are JSON (kombu.utils.json), with the
# inner (args, kwargs, embed) body additionally base64-encoded (kombu's default
# body_encoding). See job.rs for the exact envelope struct.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Celery task/correlation IDs are UUID4 strings (Python's uuid.uuid4()), same shape
# kombu uses for its own delivery_tag.
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"

# Table formatting
comfy-table = "7"

# Time formatting
chrono = { version = "0.4", features = ["serde"] }

# URL parsing — safe password encoding and redaction
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
