name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x86_64 build on a standard GitHub-hosted runner.
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          # Native aarch64 build on a GitHub-hosted arm64 runner — no QEMU/cross-rs
          # involved, so the resulting binary is built (and can be smoke-tested) on
          # real ARM hardware rather than emulated.
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rustls pulls in `ring`, which compiles C and assembly, so the musl target needs a musl
      # C toolchain even though the rest of the tree is pure Rust.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify architecture
        run: file "target/${{ matrix.target }}/release/celery-bench"

      - name: Sanity-check the binary actually runs (native, not emulated)
        run: "target/${{ matrix.target }}/release/celery-bench --help"

      # A successful build says nothing about where the artifact can RUN. The previous -gnu
      # releases were built on ubuntu-24.04 and silently required GLIBC_2.39, so they could not
      # execute on Ubuntu 22.04 (2.35), Debian 12 (2.36) or RHEL 9 (2.34) -- and the failure mode
      # was a loader error at first use, not a build error. Assert the floor is gone.
      - name: Assert no glibc dependency
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/celery-bench"
          if objdump -T "$BIN" 2>/dev/null | grep -qE 'GLIBC_[0-9]+\.[0-9]+'; then
            MAX=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
            echo "::error::artifact still links against glibc (max $MAX); it will not run on older hosts"
            exit 1
          fi
          file "$BIN"
          echo "OK: statically linked, no glibc version floor"

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          STAGE="celery-bench-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/celery-bench" "$STAGE/"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          rm -rf "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: celery-bench-${{ matrix.target }}
          path: |
            celery-bench-${{ matrix.target }}.tar.gz
            celery-bench-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
