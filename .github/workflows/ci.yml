name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, lint, test, smoke
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Guard against tls-rustls-insecure feature regression
        # There's no way for a binary crate to assert a *dependency's* Cargo feature
        # is enabled at compile/test time — `#[cfg(feature = "...")]` only sees this
        # crate's own features. If `tls-rustls-insecure` is ever dropped from the
        # `redis` dependency in Cargo.toml (or from the resolved graph some other
        # way), `--insecure` doesn't go quiet — every `--insecure`/`#insecure`
        # connection attempt starts hard-failing at connect time instead (see the
        # Cargo.toml comment next to the `redis` dependency, and the README "TLS"
        # section). Check the resolved feature graph directly so that regression
        # fails CI instead of surfacing as a support ticket.
        run: |
          cargo tree -e features -i redis --workspace | grep -q tls-rustls-insecure || {
            echo "::error::tls-rustls-insecure is missing from the resolved 'redis' dependency's feature graph — --insecure would start hard-failing every connection instead of skipping cert verification. See the Cargo.toml comment next to the redis dependency."
            exit 1
          }

      - name: Build
        run: cargo build --release

      - name: Clippy
        # --all-targets covers tests/ (integration tests) and #[cfg(test)] unit test
        # modules too, not just the lib/bin — a lint-only issue confined to test code
        # would otherwise slip past a plain `cargo clippy`.
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests (real Redis)
        # `cargo test` compiles and runs both the unit tests in src/*.rs AND the
        # tests/protocol_integration.rs integration tests, which exercise the real
        # producer/worker code against the `redis` service above (default target
        # redis://127.0.0.1:6379/15 — same service, isolated db from the smoke test's
        # db 0). No separate job needed: the service is already up for this step.
        run: cargo test

      - name: Smoke test (end-to-end against Redis service)
        run: |
          cargo run --release -- \
            --url redis://127.0.0.1:6379/0 \
            --workers 2 \
            --jobs 500 \
            --timeout 60 \
            --output /tmp/smoke.json \
            --quiet \
            --tag smoke
          # Verify the run completed all jobs without timing out
          jq -e '
            .results[0].total_jobs == 500 and
            .results[0].timed_out == false and
            .results[0].errors == 0 and
            .results[0].latency_us.total_count == 500
          ' /tmp/smoke.json

      - name: TLS regression test (self-signed cert, real redis-server)
        # Guards the second, previously-unreported bug this PR also fixes: redis-rs's
        # rustls integration panics on ANY --tls connection (not just --insecure) if
        # nothing installs a process-wide CryptoProvider (see src/tls.rs). Unit tests
        # can't catch this — it only reproduces against a real TLS handshake — so this
        # spins up an actual TLS-enabled redis-server (the `services:` block above
        # can't take a custom command, hence a plain `docker run` here) and drives the
        # built binary at it both without and with --insecure.
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          # `mktemp -d` creates the directory 0700 (owner-only, no `x` for
          # others) — redis-server runs as a *different* uid inside the
          # container, so without world-traversable permissions on the
          # directory itself it can't even stat the cert/key inside it,
          # regardless of their own file modes ("Permission denied" reading
          # the cert, observed when this was first wired up). It's a
          # throwaway dir/cert regenerated every run, so 755/644 are fine.
          chmod 755 "$workdir"
          openssl req -x509 -newkey rsa:2048 -keyout "$workdir/redis.key" \
            -out "$workdir/redis.crt" -days 1 -nodes -subj "/CN=localhost"
          # redis-server (running as a non-root user inside the container) must be
          # able to read the key; it's a throwaway cert regenerated every run.
          chmod 644 "$workdir/redis.key"

          docker run -d --name redis-tls \
            -p 16380:16380 \
            -v "$workdir:/certs:ro" \
            redis:8.6 \
            redis-server --port 0 \
              --tls-port 16380 \
              --tls-cert-file /certs/redis.crt \
              --tls-key-file /certs/redis.key \
              --tls-ca-cert-file /certs/redis.crt \
              --tls-cluster no --tls-replication no --tls-auth-clients no

          # Wait for the TLS listener to come up rather than a fixed sleep.
          for i in $(seq 1 30); do
            if docker exec redis-tls redis-cli --tls --insecure -p 16380 ping 2>/dev/null | grep -q PONG; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::redis-server TLS listener never came up"
              docker logs redis-tls
              exit 1
            fi
            sleep 1
          done

          echo "--- without --insecure: must fail cleanly on the self-signed cert, not panic ---"
          set +e
          cargo run --release -- \
            --url rediss://127.0.0.1:16380/0 \
            --workers 1 --jobs 5 --timeout 10 --output - --quiet --tag ci-tls-no-insecure \
            >/tmp/tls_no_insecure.stdout 2>/tmp/tls_no_insecure.stderr
          status=$?
          set -e
          cat /tmp/tls_no_insecure.stderr
          if [ "$status" -eq 0 ]; then
            echo "::error::expected a non-zero exit connecting without --insecure against a self-signed cert, got 0"
            exit 1
          fi
          if grep -qi "panic" /tmp/tls_no_insecure.stderr; then
            echo "::error::TLS connection attempt panicked instead of failing cleanly with a cert error — see src/tls.rs (missing CryptoProvider install)"
            exit 1
          fi

          echo "--- with --insecure: must succeed ---"
          cargo run --release -- \
            --url rediss://127.0.0.1:16380/0 --insecure \
            --workers 1 --jobs 5 --timeout 10 --output - --quiet --tag ci-tls-insecure

          docker rm -f redis-tls >/dev/null
