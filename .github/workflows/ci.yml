name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, lint, test, smoke
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Guard against tls-rustls-insecure feature regression
        # There's no way for a binary crate to assert a *dependency's* Cargo feature
        # is enabled at compile/test time — `#[cfg(feature = "...")]` only sees this
        # crate's own features. If `tls-rustls-insecure` is ever dropped from the
        # `redis` dependency in Cargo.toml (or from the resolved graph some other
        # way), `--insecure` doesn't go quiet — every `--insecure`/`#insecure`
        # connection attempt starts hard-failing at connect time instead (see the
        # Cargo.toml comment next to the `redis` dependency, and the README "TLS"
        # section). Check the resolved feature graph directly so that regression
        # fails CI instead of surfacing as a support ticket.
        run: |
          cargo tree -e features -i redis --workspace | grep -q tls-rustls-insecure || {
            echo "::error::tls-rustls-insecure is missing from the resolved 'redis' dependency's feature graph — --insecure would start hard-failing every connection instead of skipping cert verification. See the Cargo.toml comment next to the redis dependency."
            exit 1
          }

      - name: Build
        run: cargo build --release

      - name: Clippy
        # --all-targets covers tests/ (integration tests) and #[cfg(test)] unit test
        # modules too, not just the lib/bin — a lint-only issue confined to test code
        # would otherwise slip past a plain `cargo clippy`.
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests (real Redis)
        # `cargo test` compiles and runs both the unit tests in src/*.rs AND the
        # tests/protocol_integration.rs integration tests, which exercise the real
        # producer/worker code against the `redis` service above (default target
        # redis://127.0.0.1:6379/15 — same service, isolated db from the smoke test's
        # db 0). No separate job needed: the service is already up for this step.
        run: cargo test

      - name: Smoke test (end-to-end against Redis service)
        run: |
          cargo run --release -- \
            --url redis://127.0.0.1:6379/0 \
            --workers 2 \
            --jobs 500 \
            --timeout 60 \
            --output /tmp/smoke.json \
            --quiet \
            --tag smoke
          # Verify the run completed all jobs without timing out
          jq -e '
            .results[0].total_jobs == 500 and
            .results[0].timed_out == false and
            .results[0].errors == 0 and
            .results[0].latency_us.total_count == 500
          ' /tmp/smoke.json
